<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Космический Кликер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0b13;
            --text-color: #ffffff;
            --accent-color: #667eea;
            --accent-gradient: linear-gradient(135deg, #667eea, #ff8a00);
            --planet-color: radial-gradient(circle at 30% 30%, #8a2be2, #4b0082, #000080);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.5s;
        }

        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }

        .container {
            text-align: center;
            z-index: 1;
            width: 100%;
            padding: 20px;
            max-width: 400px;
        }

        .galaxy-name {
            font-size: 20px;
            font-weight: bold;
            color: #a0a0b5;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-display {
            font-size: 48px;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .planet {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: var(--planet-color);
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.6);
            margin: 20px auto;
            cursor: pointer;
            transition: transform 0.1s, background 0.5s;
        }

        .planet:active { transform: scale(0.9); }

        .click-effect {
            position: absolute;
            pointer-events: none;
            font-size: 24px;
            font-weight: bold;
            color: #ff8a00;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
        }

        .upgrade-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 10px;
            width: 100%;
        }

        .upgrade-btn:disabled { opacity: 0.5; }
        .upgrade-title { font-weight: bold; }
        .upgrade-cost { color: #ff8a00; }

        .next-galaxy-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: none;
            padding: 15px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }

        .save-btn {
            margin-top: 10px;
            background: var(--accent-gradient);
            border: none;
            padding: 15px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <div class="galaxy-name" id="galaxy-name">Галактика 1: Туманность</div>
        <div class="score-display" id="score">0</div>
        <div class="planet" id="planet"></div>
        
        <button class="upgrade-btn" id="upgrade1">
            <div>
                <div class="upgrade-title">Ускоритель</div>
                <div style="font-size:12px; color:#a0a0b5;">+1 пыль/сек</div>
            </div>
            <div class="upgrade-cost">Стоимость: 10</div>
        </button>
        
        <button class="upgrade-btn" id="upgrade2">
            <div>
                <div class="upgrade-title">Множитель</div>
                <div style="font-size:12px; color:#a0a0b5;">+1 к клику</div>
            </div>
            <div class="upgrade-cost">Стоимость: 50</div>
        </button>

        <button class="next-galaxy-btn" id="next-galaxy" style="display:none;">🌌 Открыть новую галактику</button>
        <button class="save-btn" id="save-btn">Сохранить прогресс</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Состояние игры
        let score = 0;
        let clickPower = 1;
        let passiveIncome = 0;
        let upgrade1Cost = 10;
        let upgrade2Cost = 50;
        let galaxy = 1;
        let multiplier = 1;

        const galaxies = [
            { name: "Туманность", bg: "#0b0b13", color: "radial-gradient(circle at 30% 30%, #8a2be2, #4b0082, #000080)", gradient: "linear-gradient(135deg, #667eea, #ff8a00)" },
            { name: "Красный гигант", bg: "#1a0505", color: "radial-gradient(circle at 30% 30%, #ff416c, #8b0000, #330000)", gradient: "linear-gradient(135deg, #ff416c, #ff8a00)" },
            { name: "Изумрудный мир", bg: "#051a05", color: "radial-gradient(circle at 30% 30%, #00ff87, #008000, #003300)", gradient: "linear-gradient(135deg, #00ff87, #60efff)" },
            { name: "Ледяной космос", bg: "#050d1a", color: "radial-gradient(circle at 30% 30%, #00c6ff, #0072ff, #001a33)", gradient: "linear-gradient(135deg, #00c6ff, #0072ff)" },
            { name: "Золотая империя", bg: "#1a1505", color: "radial-gradient(circle at 30% 30%, #ffd700, #b8860b, #332200)", gradient: "linear-gradient(135deg, #ffd700, #ff8a00)" }
        ];

        const scoreEl = document.getElementById('score');
        const planet = document.getElementById('planet');
        const btn1 = document.getElementById('upgrade1');
        const btn2 = document.getElementById('upgrade2');
        const saveBtn = document.getElementById('save-btn');
        const nextGalaxyBtn = document.getElementById('next-galaxy');
        const galaxyNameEl = document.getElementById('galaxy-name');

        function updateUI() {
            scoreEl.innerText = Math.floor(score);
            document.querySelector('#upgrade1 .upgrade-cost').innerText = `Стоимость: ${upgrade1Cost}`;
            document.querySelector('#upgrade2 .upgrade-cost').innerText = `Стоимость: ${upgrade2Cost}`;
            btn1.disabled = score < upgrade1Cost;
            btn2.disabled = score < upgrade2Cost;
            
            // Проверка на новую галактику (каждые 200 пыли)
            if (score >= 200 && galaxy < galaxies.length) {
                nextGalaxyBtn.style.display = 'block';
            } else {
                nextGalaxyBtn.style.display = 'none';
            }
        }

        planet.addEventListener('click', (e) => {
            score += clickPower * multiplier;
            updateUI();
            createClickEffect(e, `+${clickPower * multiplier}`);
        });

        function createClickEffect(e, text) {
            const effect = document.createElement('div');
            effect.className = 'click-effect';
            effect.innerText = text;
            effect.style.left = e.clientX + 'px';
            effect.style.top = e.clientY + 'px';
            document.body.appendChild(effect);
            setTimeout(() => effect.remove(), 800);
        }

        btn1.addEventListener('click', () => {
            if (score >= upgrade1Cost) {
                score -= upgrade1Cost;
                passiveIncome += 1;
                upgrade1Cost = Math.floor(upgrade1Cost * 1.5);
                updateUI();
            }
        });

        btn2.addEventListener('click', () => {
            if (score >= upgrade2Cost) {
                score -= upgrade2Cost;
                clickPower += 1;
                upgrade2Cost = Math.floor(upgrade2Cost * 2);
                updateUI();
            }
        });

        setInterval(() => {
            if (passiveIncome > 0) {
                score += passiveIncome * multiplier;
                updateUI();
            }
        }, 1000);

        nextGalaxyBtn.addEventListener('click', () => {
            if (score >= 200 && galaxy < galaxies.length) {
                galaxy++;
                multiplier += 1; // Увеличиваем множитель
                score = 0;
                upgrade1Cost = 10;
                upgrade2Cost = 50;
                
                // Меняем стили
                const g = galaxies[galaxy - 1];
                document.body.style.backgroundColor = g.bg;
                planet.style.background = g.color;
                document.documentElement.style.setProperty('--accent-gradient', g.gradient);
                galaxyNameEl.innerText = `Галактика ${galaxy}: ${g.name}`;
                
                updateUI();
            }
        });

        saveBtn.addEventListener('click', () => {
            tg.sendData(JSON.stringify({ score: Math.floor(score), galaxy: galaxy }));
            tg.showAlert(`Сохранено! Галактика: ${galaxy}, Пыль: ${Math.floor(score)}`);
        });

        updateUI();
    </script>
</body>
</html>
